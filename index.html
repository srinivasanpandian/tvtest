<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Display System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <div id="media-container">
        <!-- Media items -->
        <video src="media/1.mp4" muted playsinline autoplay></video>
        <img src="media/2.jpg" alt="Display Image 2">
        <img src="media/3.jpg" alt="Display Image 3">
        <video src="media/5.mp4" muted playsinline autoplay></video>
        <img src="media/6.jpg" alt="Display Image 6">
        <img src="media/7.jpg" alt="Display Image 7">
        <img src="media/8.jpg" alt="Display Image 8">
        <video src="media/TV Series Bible Presentation in Black and White Ash Grey Minimalist  Style (1).mp4" muted playsinline autoplay></video>

        <!-- <video src="media/video5.mp4" muted></video> -->
    </div>
    
    <div id="error-message"></div>
    <div class="loading"></div>

    <script src="script.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful');
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }

        // Add to homescreen prompt handler
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });
    </script>
</body>
</html>
